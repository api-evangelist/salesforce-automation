openapi: 3.1.0
info:
  title: Salesforce Analytics (CRM Analytics) REST Actions Graph API
  description: REST API for accessing and managing CRM Analytics (formerly Tableau CRM / Einstein Analytics) resources including datasets, lenses, dashboards, and dataflows. Enables programmatic access to analytics metadata, query execution, and dashboard management. Uses the Wave API resource at /services/data/vXX.0/wave.
  version: '63.0'
  contact:
    name: Salesforce Developer Support
    url: https://developer.salesforce.com/support
    email: developer@salesforce.com
  license:
    name: Salesforce API Terms of Use
    url: https://www.salesforce.com/company/legal/agreements/
servers:
- url: https://{instance}.salesforce.com/services/data/v63.0/wave
  description: Salesforce production or developer instance
  variables:
    instance:
      default: yourInstance
      description: Your Salesforce instance identifier
security:
- oauth2: []
- bearerAuth: []
tags:
- name: Graph
  description: Subrequests with dependency graphs
paths:
  /composite/graph:
    post:
      operationId: executeCompositeGraph
      summary: Execute composite graph request
      description: Executes a set of composite graphs, each containing subrequests that can reference each other through a dependency graph. Supports up to 500 subrequests across all graphs. Graphs are independent; subrequests within a graph execute in dependency order.
      tags:
      - Graph
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GraphRequest'
      responses:
        '200':
          description: Graph response with results for each graph and subrequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphResponse'
components:
  schemas:
    GraphRequest:
      type: object
      required:
      - graphs
      properties:
        graphs:
          type: array
          items:
            type: object
            required:
            - graphId
            - compositeRequest
            properties:
              graphId:
                type: string
                description: Unique identifier for this graph
              compositeRequest:
                type: array
                items:
                  $ref: '#/components/schemas/CompositeSubrequest'
    GraphResponse:
      type: object
      properties:
        graphs:
          type: array
          items:
            type: object
            properties:
              graphId:
                type: string
              graphResponse:
                $ref: '#/components/schemas/CompositeResponse'
              isSuccessful:
                type: boolean
    CompositeSubrequest:
      type: object
      required:
      - method
      - url
      - referenceId
      properties:
        body:
          description: The request body for POST/PATCH subrequests
          additionalProperties: true
        httpHeaders:
          type: object
          additionalProperties:
            type: string
        method:
          type: string
          enum:
          - GET
          - POST
          - PATCH
          - PUT
          - DELETE
        referenceId:
          type: string
          description: Unique identifier for this subrequest, used to reference its output in subsequent subrequests
        url:
          type: string
          description: The relative URL of the API endpoint for this subrequest
    CompositeResponse:
      type: object
      properties:
        compositeResponse:
          type: array
          items:
            type: object
            properties:
              body:
                description: The response body
              httpHeaders:
                type: object
                additionalProperties:
                  type: string
              httpStatusCode:
                type: integer
              referenceId:
                type: string
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://login.salesforce.com/services/oauth2/authorize
          tokenUrl: https://login.salesforce.com/services/oauth2/token
          scopes:
            api: Access and manage your Salesforce data
            wave_api: Access CRM Analytics REST API resources
    bearerAuth:
      type: http
      scheme: bearer
