openapi: 3.1.0
info:
  title: Salesforce Analytics (CRM Analytics) REST Actions Custom Actions API
  description: REST API for accessing and managing CRM Analytics (formerly Tableau CRM / Einstein Analytics) resources including datasets, lenses, dashboards, and dataflows. Enables programmatic access to analytics metadata, query execution, and dashboard management. Uses the Wave API resource at /services/data/vXX.0/wave.
  version: '63.0'
  contact:
    name: Salesforce Developer Support
    url: https://developer.salesforce.com/support
    email: developer@salesforce.com
  license:
    name: Salesforce API Terms of Use
    url: https://www.salesforce.com/company/legal/agreements/
servers:
- url: https://{instance}.salesforce.com/services/data/v63.0/wave
  description: Salesforce production or developer instance
  variables:
    instance:
      default: yourInstance
      description: Your Salesforce instance identifier
security:
- oauth2: []
- bearerAuth: []
tags:
- name: Custom Actions
  description: Custom Apex invocable actions (@InvocableMethod)
paths:
  /actions/custom:
    get:
      operationId: getCustomActions
      summary: List custom invocable actions
      description: Returns a list of all custom invocable actions defined in the org. Custom actions are Apex classes annotated with @InvocableMethod.
      tags:
      - Custom Actions
      responses:
        '200':
          description: List of custom actions
          content:
            application/json:
              schema:
                type: object
                properties:
                  actions:
                    type: array
                    items:
                      $ref: '#/components/schemas/ActionSummary'
  /actions/custom/{actionName}:
    get:
      operationId: describeCustomAction
      summary: Describe a custom action
      description: Returns the input and output parameters for a specific custom invocable action.
      tags:
      - Custom Actions
      parameters:
      - name: actionName
        in: path
        required: true
        description: The API name of the custom action
        schema:
          type: string
      responses:
        '200':
          description: Action description
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionDescribe'
    post:
      operationId: invokeCustomAction
      summary: Invoke a custom action
      description: Invokes a custom Apex invocable action. Provide the required inputs as defined by the @InvocableVariable annotations on the action's input class.
      tags:
      - Custom Actions
      parameters:
      - name: actionName
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionInvocationRequest'
      responses:
        '200':
          description: Action invocation results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ActionInvocationResult'
components:
  schemas:
    ActionSummary:
      type: object
      properties:
        label:
          type: string
          description: Display label for the action
        name:
          type: string
          description: The API name of the action
        type:
          type: string
          description: The action type (STANDARD, CUSTOM, FLOW, etc.)
        url:
          type: string
          description: URL to get the full action description
    ActionParameter:
      type: object
      properties:
        name:
          type: string
          description: The API name of the parameter
        label:
          type: string
        description:
          type:
          - string
          - 'null'
        type:
          type: string
          description: The data type (STRING, BOOLEAN, NUMBER, DATE, DATETIME, ID, SOBJECT, etc.)
        required:
          type: boolean
        sobjectType:
          type:
          - string
          - 'null'
          description: For SOBJECT type parameters, the SObject type name
        byteLength:
          type: integer
        maxOccurs:
          type: integer
          description: Maximum number of values (1 for single value, -1 for collections)
    ActionInvocationResult:
      type: object
      properties:
        actionName:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              statusCode:
                type: string
              message:
                type: string
              fields:
                type: array
                items:
                  type: string
        isSuccess:
          type: boolean
        outputValues:
          type: object
          additionalProperties: true
          description: Output parameter name-value pairs from the action
    ActionDescribe:
      type: object
      properties:
        description:
          type:
          - string
          - 'null'
        label:
          type: string
        name:
          type: string
        type:
          type: string
        inputs:
          type: array
          items:
            $ref: '#/components/schemas/ActionParameter'
        outputs:
          type: array
          items:
            $ref: '#/components/schemas/ActionParameter'
    ActionInvocationRequest:
      type: object
      required:
      - inputs
      properties:
        inputs:
          type: array
          items:
            type: object
            additionalProperties: true
            description: Input parameter name-value pairs for one invocation
          description: Array of input objects. Each item represents one invocation of the action.
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://login.salesforce.com/services/oauth2/authorize
          tokenUrl: https://login.salesforce.com/services/oauth2/token
          scopes:
            api: Access and manage your Salesforce data
            wave_api: Access CRM Analytics REST API resources
    bearerAuth:
      type: http
      scheme: bearer
