openapi: 3.1.0
info:
  title: Salesforce Analytics (CRM Analytics) REST Actions SObject Tree API
  description: REST API for accessing and managing CRM Analytics (formerly Tableau CRM / Einstein Analytics) resources including datasets, lenses, dashboards, and dataflows. Enables programmatic access to analytics metadata, query execution, and dashboard management. Uses the Wave API resource at /services/data/vXX.0/wave.
  version: '63.0'
  contact:
    name: Salesforce Developer Support
    url: https://developer.salesforce.com/support
    email: developer@salesforce.com
  license:
    name: Salesforce API Terms of Use
    url: https://www.salesforce.com/company/legal/agreements/
servers:
- url: https://{instance}.salesforce.com/services/data/v63.0/wave
  description: Salesforce production or developer instance
  variables:
    instance:
      default: yourInstance
      description: Your Salesforce instance identifier
security:
- oauth2: []
- bearerAuth: []
tags:
- name: SObject Tree
  description: Create nested parent-child records
paths:
  /composite/tree/{sObjectName}:
    post:
      operationId: createRecordTree
      summary: Create nested records in a single request
      description: Creates a parent record and its related child records in a single request. Supports up to 200 records total with up to 5 levels of nesting. Useful for creating an Account with its Contacts and Opportunities in one call.
      tags:
      - SObject Tree
      parameters:
      - name: sObjectName
        in: path
        required: true
        description: The parent SObject type
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SObjectTreeRequest'
      responses:
        '201':
          description: Records created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SObjectTreeResponse'
components:
  schemas:
    SObjectTreeRequest:
      type: object
      required:
      - records
      properties:
        records:
          type: array
          items:
            type: object
            required:
            - attributes
            properties:
              attributes:
                type: object
                required:
                - type
                - referenceId
                properties:
                  type:
                    type: string
                  referenceId:
                    type: string
            additionalProperties: true
    SObjectTreeResponse:
      type: object
      properties:
        hasErrors:
          type: boolean
        results:
          type: array
          items:
            type: object
            properties:
              referenceId:
                type: string
              id:
                type: string
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://login.salesforce.com/services/oauth2/authorize
          tokenUrl: https://login.salesforce.com/services/oauth2/token
          scopes:
            api: Access and manage your Salesforce data
            wave_api: Access CRM Analytics REST API resources
    bearerAuth:
      type: http
      scheme: bearer
