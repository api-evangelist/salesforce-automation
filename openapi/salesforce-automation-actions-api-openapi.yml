openapi: 3.2.0
info:
  title: Salesforce Invocable Actions API
  description: REST API for discovering and invoking standard and custom actions programmatically. Actions include flow invocations, email alerts, quick actions, Apex invocable methods, and external service actions. This API is used to trigger automation from external systems or to build custom user interfaces that invoke Salesforce automation.
  version: '63.0'
  contact:
    name: Salesforce Developer Support
    url: https://developer.salesforce.com/support
    email: developer@salesforce.com
  license:
    name: Salesforce API Terms of Use
    url: https://www.salesforce.com/company/legal/agreements/
servers:
- url: https://{instance}.salesforce.com/services/data/v63.0
  description: Salesforce production or developer instance
  variables:
    instance:
      default: yourInstance
      description: Your Salesforce instance identifier
security:
- oauth2: []
- bearerAuth: []
tags:
- name: Actions
  description: Action type discovery
paths:
  /actions:
    get:
      operationId: getActionTypes
      summary: List available action types
      description: Returns a list of all available action types including standard, custom, and flow actions. Action types include standard (Salesforce-provided), custom (Apex invocable actions), and flow (autolaunched flows).
      tags:
      - Actions
      responses:
        '200':
          description: List of action types
          content:
            application/json:
              schema:
                type: object
                properties:
                  standard:
                    type: string
                    description: URL for standard actions
                  custom:
                    type: string
                    description: URL for custom actions
components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://login.salesforce.com/services/oauth2/authorize
          tokenUrl: https://login.salesforce.com/services/oauth2/token
          scopes:
            api: Access and manage your Salesforce data
    bearerAuth:
      type: http
      scheme: bearer
