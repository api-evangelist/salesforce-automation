openapi: 3.1.0
info:
  title: Salesforce Analytics (CRM Analytics) REST Actions Comments API
  description: REST API for accessing and managing CRM Analytics (formerly Tableau CRM / Einstein Analytics) resources including datasets, lenses, dashboards, and dataflows. Enables programmatic access to analytics metadata, query execution, and dashboard management. Uses the Wave API resource at /services/data/vXX.0/wave.
  version: '63.0'
  contact:
    name: Salesforce Developer Support
    url: https://developer.salesforce.com/support
    email: developer@salesforce.com
  license:
    name: Salesforce API Terms of Use
    url: https://www.salesforce.com/company/legal/agreements/
servers:
- url: https://{instance}.salesforce.com/services/data/v63.0/wave
  description: Salesforce production or developer instance
  variables:
    instance:
      default: yourInstance
      description: Your Salesforce instance identifier
security:
- oauth2: []
- bearerAuth: []
tags:
- name: Comments
  description: Comments on feed elements
paths:
  /chatter/feed-elements/{feedElementId}/capabilities/comments/items:
    get:
      operationId: getComments
      summary: Get comments on a feed element
      description: Returns comments on a Chatter feed element.
      tags:
      - Comments
      parameters:
      - name: feedElementId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Comments on the feed element
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentPage'
    post:
      operationId: postComment
      summary: Post a comment on a feed element
      description: Adds a comment to a Chatter feed element.
      tags:
      - Comments
      parameters:
      - name: feedElementId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentInput'
      responses:
        '201':
          description: Comment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
components:
  schemas:
    ActorRef:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
        url:
          type: string
        photo:
          type: object
          properties:
            smallPhotoUrl:
              type: string
            largePhotoUrl:
              type: string
    CommentPage:
      type: object
      properties:
        comments:
          type: array
          items:
            $ref: '#/components/schemas/Comment'
        currentPageUrl:
          type: string
        nextPageUrl:
          type:
          - string
          - 'null'
        total:
          type: integer
    Comment:
      type: object
      properties:
        id:
          type: string
        body:
          $ref: '#/components/schemas/MessageBody'
        user:
          $ref: '#/components/schemas/ActorRef'
        createdDate:
          type: string
          format: date-time
        url:
          type: string
    MessageBody:
      type: object
      properties:
        messageSegments:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
              text:
                type: string
        text:
          type: string
    CommentInput:
      type: object
      required:
      - body
      properties:
        body:
          type: object
          properties:
            messageSegments:
              type: array
              items:
                type: object
                properties:
                  type:
                    type: string
                  text:
                    type: string
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://login.salesforce.com/services/oauth2/authorize
          tokenUrl: https://login.salesforce.com/services/oauth2/token
          scopes:
            api: Access and manage your Salesforce data
            wave_api: Access CRM Analytics REST API resources
    bearerAuth:
      type: http
      scheme: bearer
