naftiko: 1.0.0-alpha2
info:
  label: Salesforce REST API — Limits
  description: 'Salesforce REST API — Limits. 1 operations. Lead operation: Get org limits. Self-contained Naftiko capability
    covering one Salesforce Automation business surface.'
  tags:
  - Salesforce Automation
  - Limits
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_AUTOMATION_API_KEY: SALESFORCE_AUTOMATION_API_KEY
capability:
  consumes:
  - type: http
    namespace: salesforce-rest-limits
    baseUri: https://{instance}.salesforce.com/services/data/v63.0
    description: Salesforce REST API — Limits business capability. Self-contained, no shared references.
    resources:
    - name: limits
      path: /limits
      operations:
      - name: getlimits
        method: GET
        description: Get org limits
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.SALESFORCE_AUTOMATION_API_KEY}}'
  exposes:
  - type: rest
    namespace: salesforce-rest-limits-rest
    port: 8080
    description: REST adapter for Salesforce REST API — Limits. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/limits
      name: limits
      description: REST surface for limits.
      operations:
      - method: GET
        name: getlimits
        description: Get org limits
        call: salesforce-rest-limits.getlimits
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: salesforce-rest-limits-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce REST API — Limits. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: get-org-limits
      description: Get org limits
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: salesforce-rest-limits.getlimits
      outputParameters:
      - type: object
        mapping: $.
