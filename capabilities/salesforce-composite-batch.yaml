naftiko: 1.0.0-alpha2
info:
  label: Salesforce Composite API — Batch
  description: 'Salesforce Composite API — Batch. 1 operations. Lead operation: Execute composite batch request. Self-contained
    Naftiko capability covering one Salesforce Automation business surface.'
  tags:
  - Salesforce Automation
  - Batch
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_AUTOMATION_API_KEY: SALESFORCE_AUTOMATION_API_KEY
capability:
  consumes:
  - type: http
    namespace: salesforce-composite-batch
    baseUri: https://{instance}.salesforce.com/services/data/v63.0
    description: Salesforce Composite API — Batch business capability. Self-contained, no shared references.
    resources:
    - name: composite-batch
      path: /composite/batch
      operations:
      - name: executecompositebatch
        method: POST
        description: Execute composite batch request
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.SALESFORCE_AUTOMATION_API_KEY}}'
  exposes:
  - type: rest
    namespace: salesforce-composite-batch-rest
    port: 8080
    description: REST adapter for Salesforce Composite API — Batch. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/composite/batch
      name: composite-batch
      description: REST surface for composite-batch.
      operations:
      - method: POST
        name: executecompositebatch
        description: Execute composite batch request
        call: salesforce-composite-batch.executecompositebatch
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: salesforce-composite-batch-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce Composite API — Batch. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: execute-composite-batch-request
      description: Execute composite batch request
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: salesforce-composite-batch.executecompositebatch
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
