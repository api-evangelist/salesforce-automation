naftiko: 1.0.0-alpha2
info:
  label: Salesforce Analytics (CRM Analytics) REST API — Query
  description: 'Salesforce Analytics (CRM Analytics) REST API — Query. 1 operations. Lead operation: Execute a SAQL query.
    Self-contained Naftiko capability covering one Salesforce Automation business surface.'
  tags:
  - Salesforce Automation
  - Query
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_AUTOMATION_API_KEY: SALESFORCE_AUTOMATION_API_KEY
capability:
  consumes:
  - type: http
    namespace: salesforce-analytics-query
    baseUri: https://{instance}.salesforce.com/services/data/v63.0/wave
    description: Salesforce Analytics (CRM Analytics) REST API — Query business capability. Self-contained, no shared references.
    resources:
    - name: query
      path: /query
      operations:
      - name: executequery
        method: POST
        description: Execute a SAQL query
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.SALESFORCE_AUTOMATION_API_KEY}}'
  exposes:
  - type: rest
    namespace: salesforce-analytics-query-rest
    port: 8080
    description: REST adapter for Salesforce Analytics (CRM Analytics) REST API — Query. One Spectral-compliant resource per
      consumed operation, prefixed with /v1.
    resources:
    - path: /v1/query
      name: query
      description: REST surface for query.
      operations:
      - method: POST
        name: executequery
        description: Execute a SAQL query
        call: salesforce-analytics-query.executequery
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: salesforce-analytics-query-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce Analytics (CRM Analytics) REST API — Query. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: execute-saql-query
      description: Execute a SAQL query
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: salesforce-analytics-query.executequery
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
