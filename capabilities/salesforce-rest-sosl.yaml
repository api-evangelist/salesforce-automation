naftiko: 1.0.0-alpha2
info:
  label: Salesforce REST API — SOSL
  description: 'Salesforce REST API — SOSL. 1 operations. Lead operation: Execute a SOSL search. Self-contained Naftiko capability
    covering one Salesforce Automation business surface.'
  tags:
  - Salesforce Automation
  - SOSL
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_AUTOMATION_API_KEY: SALESFORCE_AUTOMATION_API_KEY
capability:
  consumes:
  - type: http
    namespace: salesforce-rest-sosl
    baseUri: https://{instance}.salesforce.com/services/data/v63.0
    description: Salesforce REST API — SOSL business capability. Self-contained, no shared references.
    resources:
    - name: search
      path: /search
      operations:
      - name: search
        method: GET
        description: Execute a SOSL search
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: q
          in: query
          type: string
          description: The SOSL search string (e.g., FIND {Acme} IN ALL FIELDS RETURNING Account(Id, Name), Contact(Id, Name,
            Email))
          required: true
    authentication:
      type: bearer
      token: '{{env.SALESFORCE_AUTOMATION_API_KEY}}'
  exposes:
  - type: rest
    namespace: salesforce-rest-sosl-rest
    port: 8080
    description: REST adapter for Salesforce REST API — SOSL. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/search
      name: search
      description: REST surface for search.
      operations:
      - method: GET
        name: search
        description: Execute a SOSL search
        call: salesforce-rest-sosl.search
        with:
          q: rest.q
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: salesforce-rest-sosl-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce REST API — SOSL. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: execute-sosl-search
      description: Execute a SOSL search
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: salesforce-rest-sosl.search
      with:
        q: tools.q
      outputParameters:
      - type: object
        mapping: $.
