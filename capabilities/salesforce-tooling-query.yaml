naftiko: 1.0.0-alpha2
info:
  label: Salesforce Tooling API — Query
  description: 'Salesforce Tooling API — Query. 1 operations. Lead operation: Execute a Tooling API SOQL query. Self-contained
    Naftiko capability covering one Salesforce Automation business surface.'
  tags:
  - Salesforce Automation
  - Query
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_AUTOMATION_API_KEY: SALESFORCE_AUTOMATION_API_KEY
capability:
  consumes:
  - type: http
    namespace: salesforce-tooling-query
    baseUri: https://{instance}.salesforce.com/services/data/v63.0/tooling
    description: Salesforce Tooling API — Query business capability. Self-contained, no shared references.
    resources:
    - name: query
      path: /query
      operations:
      - name: toolingquery
        method: GET
        description: Execute a Tooling API SOQL query
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: q
          in: query
          type: string
          description: The SOQL query string targeting Tooling API objects (e.g., SELECT Id, FullName, Metadata FROM Flow
            WHERE Status = 'Active')
          required: true
    authentication:
      type: bearer
      token: '{{env.SALESFORCE_AUTOMATION_API_KEY}}'
  exposes:
  - type: rest
    namespace: salesforce-tooling-query-rest
    port: 8080
    description: REST adapter for Salesforce Tooling API — Query. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/query
      name: query
      description: REST surface for query.
      operations:
      - method: GET
        name: toolingquery
        description: Execute a Tooling API SOQL query
        call: salesforce-tooling-query.toolingquery
        with:
          q: rest.q
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: salesforce-tooling-query-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce Tooling API — Query. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: execute-tooling-api-soql-query
      description: Execute a Tooling API SOQL query
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: salesforce-tooling-query.toolingquery
      with:
        q: tools.q
      outputParameters:
      - type: object
        mapping: $.
