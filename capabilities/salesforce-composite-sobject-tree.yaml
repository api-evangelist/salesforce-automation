naftiko: 1.0.0-alpha2
info:
  label: Salesforce Composite API — SObject Tree
  description: 'Salesforce Composite API — SObject Tree. 1 operations. Lead operation: Create nested records in a single request.
    Self-contained Naftiko capability covering one Salesforce Automation business surface.'
  tags:
  - Salesforce Automation
  - SObject Tree
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_AUTOMATION_API_KEY: SALESFORCE_AUTOMATION_API_KEY
capability:
  consumes:
  - type: http
    namespace: salesforce-composite-sobject-tree
    baseUri: https://{instance}.salesforce.com/services/data/v63.0
    description: Salesforce Composite API — SObject Tree business capability. Self-contained, no shared references.
    resources:
    - name: composite-tree-sObjectName
      path: /composite/tree/{sObjectName}
      operations:
      - name: createrecordtree
        method: POST
        description: Create nested records in a single request
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: sObjectName
          in: path
          type: string
          description: The parent SObject type
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.SALESFORCE_AUTOMATION_API_KEY}}'
  exposes:
  - type: rest
    namespace: salesforce-composite-sobject-tree-rest
    port: 8080
    description: REST adapter for Salesforce Composite API — SObject Tree. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/composite/tree/{sobjectname}
      name: composite-tree-sobjectname
      description: REST surface for composite-tree-sObjectName.
      operations:
      - method: POST
        name: createrecordtree
        description: Create nested records in a single request
        call: salesforce-composite-sobject-tree.createrecordtree
        with:
          sObjectName: rest.sObjectName
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: salesforce-composite-sobject-tree-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce Composite API — SObject Tree. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: create-nested-records-single-request
      description: Create nested records in a single request
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: salesforce-composite-sobject-tree.createrecordtree
      with:
        sObjectName: tools.sObjectName
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
