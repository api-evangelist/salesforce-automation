naftiko: 1.0.0-alpha2
info:
  label: Salesforce REST API — Versions
  description: 'Salesforce REST API — Versions. 1 operations. Lead operation: List available REST API versions. Self-contained
    Naftiko capability covering one Salesforce Automation business surface.'
  tags:
  - Salesforce Automation
  - Versions
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_AUTOMATION_API_KEY: SALESFORCE_AUTOMATION_API_KEY
capability:
  consumes:
  - type: http
    namespace: salesforce-rest-versions
    baseUri: https://{instance}.salesforce.com/services/data/v63.0
    description: Salesforce REST API — Versions business capability. Self-contained, no shared references.
    resources:
    - name: root
      path: /
      operations:
      - name: getversions
        method: GET
        description: List available REST API versions
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.SALESFORCE_AUTOMATION_API_KEY}}'
  exposes:
  - type: rest
    namespace: salesforce-rest-versions-rest
    port: 8080
    description: REST adapter for Salesforce REST API — Versions. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1
      name: root
      description: REST surface for root.
      operations:
      - method: GET
        name: getversions
        description: List available REST API versions
        call: salesforce-rest-versions.getversions
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: salesforce-rest-versions-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce REST API — Versions. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: list-available-rest-api-versions
      description: List available REST API versions
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: salesforce-rest-versions.getversions
      outputParameters:
      - type: object
        mapping: $.
