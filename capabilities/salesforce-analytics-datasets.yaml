naftiko: 1.0.0-alpha2
info:
  label: Salesforce Analytics (CRM Analytics) REST API — Datasets
  description: 'Salesforce Analytics (CRM Analytics) REST API — Datasets. 2 operations. Lead operation: List datasets. Self-contained
    Naftiko capability covering one Salesforce Automation business surface.'
  tags:
  - Salesforce Automation
  - Datasets
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_AUTOMATION_API_KEY: SALESFORCE_AUTOMATION_API_KEY
capability:
  consumes:
  - type: http
    namespace: salesforce-analytics-datasets
    baseUri: https://{instance}.salesforce.com/services/data/v63.0/wave
    description: Salesforce Analytics (CRM Analytics) REST API — Datasets business capability. Self-contained, no shared references.
    resources:
    - name: datasets
      path: /datasets
      operations:
      - name: getdatasets
        method: GET
        description: List datasets
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: q
          in: query
          type: string
          description: Search term to filter datasets by name
        - name: folderId
          in: query
          type: string
          description: Filter datasets by analytics app (folder) ID
        - name: page
          in: query
          type: string
        - name: pageSize
          in: query
          type: integer
        - name: sort
          in: query
          type: string
        - name: order
          in: query
          type: string
    - name: datasets-datasetIdOrApiName
      path: /datasets/{datasetIdOrApiName}
      operations:
      - name: getdataset
        method: GET
        description: Get a dataset
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: datasetIdOrApiName
          in: path
          type: string
          description: The dataset ID or developer name
          required: true
    authentication:
      type: bearer
      token: '{{env.SALESFORCE_AUTOMATION_API_KEY}}'
  exposes:
  - type: rest
    namespace: salesforce-analytics-datasets-rest
    port: 8080
    description: REST adapter for Salesforce Analytics (CRM Analytics) REST API — Datasets. One Spectral-compliant resource
      per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/datasets
      name: datasets
      description: REST surface for datasets.
      operations:
      - method: GET
        name: getdatasets
        description: List datasets
        call: salesforce-analytics-datasets.getdatasets
        with:
          q: rest.q
          folderId: rest.folderId
          page: rest.page
          pageSize: rest.pageSize
          sort: rest.sort
          order: rest.order
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/datasets/{datasetidorapiname}
      name: datasets-datasetidorapiname
      description: REST surface for datasets-datasetIdOrApiName.
      operations:
      - method: GET
        name: getdataset
        description: Get a dataset
        call: salesforce-analytics-datasets.getdataset
        with:
          datasetIdOrApiName: rest.datasetIdOrApiName
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: salesforce-analytics-datasets-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce Analytics (CRM Analytics) REST API — Datasets. One tool per consumed operation,
      routed inline through this capability's consumes block.
    tools:
    - name: list-datasets
      description: List datasets
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: salesforce-analytics-datasets.getdatasets
      with:
        q: tools.q
        folderId: tools.folderId
        page: tools.page
        pageSize: tools.pageSize
        sort: tools.sort
        order: tools.order
      outputParameters:
      - type: object
        mapping: $.
    - name: get-dataset
      description: Get a dataset
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: salesforce-analytics-datasets.getdataset
      with:
        datasetIdOrApiName: tools.datasetIdOrApiName
      outputParameters:
      - type: object
        mapping: $.
