naftiko: 1.0.0-alpha2
info:
  label: Salesforce REST API — Records
  description: 'Salesforce REST API — Records. 4 operations. Lead operation: Create a new record. Self-contained Naftiko capability
    covering one Salesforce Automation business surface.'
  tags:
  - Salesforce Automation
  - Records
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_AUTOMATION_API_KEY: SALESFORCE_AUTOMATION_API_KEY
capability:
  consumes:
  - type: http
    namespace: salesforce-rest-records
    baseUri: https://{instance}.salesforce.com/services/data/v63.0
    description: Salesforce REST API — Records business capability. Self-contained, no shared references.
    resources:
    - name: sobjects-sObjectName
      path: /sobjects/{sObjectName}
      operations:
      - name: createrecord
        method: POST
        description: Create a new record
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: sobjects-sObjectName-recordId
      path: /sobjects/{sObjectName}/{recordId}
      operations:
      - name: getrecord
        method: GET
        description: Get a record by ID
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: fields
          in: query
          type: string
          description: Comma-separated list of field API names to return. Reduces payload size when you only need specific
            fields.
      - name: updaterecord
        method: PATCH
        description: Update a record
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: deleterecord
        method: DELETE
        description: Delete a record
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.SALESFORCE_AUTOMATION_API_KEY}}'
  exposes:
  - type: rest
    namespace: salesforce-rest-records-rest
    port: 8080
    description: REST adapter for Salesforce REST API — Records. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/sobjects/{sobjectname}
      name: sobjects-sobjectname
      description: REST surface for sobjects-sObjectName.
      operations:
      - method: POST
        name: createrecord
        description: Create a new record
        call: salesforce-rest-records.createrecord
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/sobjects/{sobjectname}/{recordid}
      name: sobjects-sobjectname-recordid
      description: REST surface for sobjects-sObjectName-recordId.
      operations:
      - method: GET
        name: getrecord
        description: Get a record by ID
        call: salesforce-rest-records.getrecord
        with:
          fields: rest.fields
        outputParameters:
        - type: object
          mapping: $.
      - method: PATCH
        name: updaterecord
        description: Update a record
        call: salesforce-rest-records.updaterecord
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deleterecord
        description: Delete a record
        call: salesforce-rest-records.deleterecord
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: salesforce-rest-records-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce REST API — Records. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: create-new-record
      description: Create a new record
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: salesforce-rest-records.createrecord
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: get-record-id
      description: Get a record by ID
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: salesforce-rest-records.getrecord
      with:
        fields: tools.fields
      outputParameters:
      - type: object
        mapping: $.
    - name: update-record
      description: Update a record
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: salesforce-rest-records.updaterecord
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-record
      description: Delete a record
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: salesforce-rest-records.deleterecord
      outputParameters:
      - type: object
        mapping: $.
