naftiko: 1.0.0-alpha2
info:
  label: Salesforce Connect REST API (Chatter) — Topics
  description: 'Salesforce Connect REST API (Chatter) — Topics. 1 operations. Lead operation: List topics. Self-contained
    Naftiko capability covering one Salesforce Automation business surface.'
  tags:
  - Salesforce Automation
  - Topics
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_AUTOMATION_API_KEY: SALESFORCE_AUTOMATION_API_KEY
capability:
  consumes:
  - type: http
    namespace: salesforce-connect-rest-topics
    baseUri: https://{instance}.salesforce.com/services/data/v63.0/connect
    description: Salesforce Connect REST API (Chatter) — Topics business capability. Self-contained, no shared references.
    resources:
    - name: topics
      path: /topics
      operations:
      - name: gettopics
        method: GET
        description: List topics
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: q
          in: query
          type: string
          description: Search term to filter topics
    authentication:
      type: bearer
      token: '{{env.SALESFORCE_AUTOMATION_API_KEY}}'
  exposes:
  - type: rest
    namespace: salesforce-connect-rest-topics-rest
    port: 8080
    description: REST adapter for Salesforce Connect REST API (Chatter) — Topics. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/topics
      name: topics
      description: REST surface for topics.
      operations:
      - method: GET
        name: gettopics
        description: List topics
        call: salesforce-connect-rest-topics.gettopics
        with:
          q: rest.q
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: salesforce-connect-rest-topics-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce Connect REST API (Chatter) — Topics. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: list-topics
      description: List topics
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: salesforce-connect-rest-topics.gettopics
      with:
        q: tools.q
      outputParameters:
      - type: object
        mapping: $.
